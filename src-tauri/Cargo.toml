[package]
name = "proxytools"
version = "0.6.0"
description = "A Tauri App"
authors = ["Eyen Tuyon"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "proxytools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["unstable"] }
tauri-plugin-opener = "2.7.2"
serde = { version = "1.0.227", features = ["derive"] }
serde_json = "1.0.145"
regex = "1.11.3"
anyhow = "1.0.100"
reqwest_cookie_store = "0.9.0"
reqwest = { version = "0.12.23", features = [
    "cookies",
    "gzip",
    "json",
    "rustls-tls",
] }
tokio = { version = "1.47.1", features = ["full"] }
html-escape = "0.2.13"
chrono = "0.4.42"
once_cell = "1.21.3"
tokio-util = "0.7.16"
rusqlite = { version = "0.40.0", features = ["bundled"] }
surge-ping = "=0.8.4"
hickory-resolver = { version = "=0.25.2", default-features = false, features = ["tokio", "system-config"] }
russh = { version = "=0.63.3", default-features = false, features = ["ring", "rsa"] }
semver = "1"
sha2 = "0.10"
similar = "2.7.0"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.0", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_System_IO"] }
webview2-com = "=0.39.1"
windows = { version = "=0.62.2", features = ["Win32_Security_Credentials", "Win32_UI_Input_KeyboardAndMouse"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18.2"

[dev-dependencies]
rand = "0.10"
